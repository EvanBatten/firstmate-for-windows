# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI runs instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns the complete lint definition, including GitHub workflow
# lint via pinned actionlint in `bin/fm-lint-workflows.sh`, and
# `.github/workflows/ci.yml` invokes it directly, with parity asserted by
# `tests/fm-lint.test.sh` and `tests/fm-lint-workflows.test.sh`.
#
# Do not set commands.test to a complete tests/*.test.sh walk. Local no-mistakes
# Test is intent-targeted validation of whether the change meets its brief;
# .github/workflows/ci.yml owns broad regression (behavior suite, platform,
# security, Herdr, tmux, and lifecycle coverage). A full-suite override here
# would duplicate CI and defeat the targeted Test contract.
# Routed through `git` because no-mistakes hands this line to cmd.exe on
# Windows, which cannot run a bare `bin/fm-lint.sh` (issue #20). A plain `bash`
# prefix only resolves when the daemon happened to inherit Git's `usr/bin` on
# PATH: on the default Machine+User PATH, `C:\WINDOWS\system32` comes before
# `C:\Program Files\Git\cmd`, and that is the only Git directory on it and
# ships no `bash.exe`, so `bash` finds the WSL launcher and the gate lints a
# different file set under Linux while still looking like it ran. `git.exe` is
# the one shell-bearing Git executable on that default PATH, and git runs a `!`
# alias through its own bundled `sh` from the repository toplevel, so the
# relative script path resolves whatever the caller's directory. The same line
# is correct on Linux and macOS, where git runs the alias through `/bin/sh` and
# the script is tracked mode 100755. Double quotes, not single, because cmd.exe
# treats `'` as an ordinary character rather than a quote.
#
# One worker, for the reason `.github/workflows/ci.yml` sets `FM_LINT_JOBS: 1`
# on its own lint step: the two default workers hold their peaks together, a
# combined 12.14 GiB on the canonical set, and `bin/fm-teardown.sh` and
# `bin/fm-watch.sh` are the whole of that sum, so a changed-file run on any
# branch that touches both pays it too - with less RAM behind it, this box
# having 15 GiB against the runner's 16 GB. Serialising makes the peak the
# largest single root instead of the sum, at roughly 1.79 times the wall time,
# and gives up no coverage anywhere. See docs/windows/measurement.md, "Linux
# baseline". Spelled as the script's own `--jobs` option rather than an
# `FM_LINT_JOBS=1` prefix, because cmd.exe cannot read a POSIX VAR=value
# prefix any more than it can run the bare script.
commands:
  lint: 'git -c alias.fmlint="!bin/fm-lint.sh --jobs 1" fmlint'

# Publish each run's test evidence to the orphan no-mistakes/evidence branch linked from the PR.
# The evidence is not committed to the feature or default branch.
#
# The Test agent runs on the contributor's box, and this fork's box is a
# Windows one where a process spawn costs about ten times what it does on
# Linux (docs/windows/measurement.md finding 27). The instructions keep the
# targeted run inside the gate's silence budget there and change nothing on a
# POSIX host, where the same suites finish in minutes.
test:
  evidence:
    store_in_repo: true
  instructions: |
    Run the suites the change touches one at a time, never concurrently, and
    prefix each with MSYS=winsymlinks:nativestrict on a Git Bash host.
    On a Git Bash host (uname prints MINGW or MSYS) a whole suite can take
    twenty minutes: prove a new or changed case with a one-case copy of its
    suite (keep every helper, drop the other invocations), keep any single
    command under five minutes, print a line after each command, and run a
    long suite only through a log file you poll in the foreground.
    Never end a turn while a background job is still running; the agent
    session ends with its final message and the job dies with it.
    docs/windows/measurement.md classifies the suites that are red on Windows
    for platform reasons; a red that matches its verdict table is not a
    regression, and the ledger's first failing assertion is the comparison.
